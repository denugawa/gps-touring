function setZoom(z){map.setZoom(Math.max(9,Math.min(19,z)),{animate:false});updateZoomUI()}
document.getElementById('zoomIn').onclick=()=>setZoom(map.getZoom()+0.5);
document.getElementById('zoomOut').onclick=()=>setZoom(map.getZoom()-0.5);
zoomRange.oninput=()=>setZoom(Number(zoomRange.value));
map.on('zoomend',updateZoomUI);updateZoomUI();
const cd=document.getElementById('countdown'),cdNum=document.getElementById('countdownNumber');
function startCountdown(){elapsed=0;playing=false;countdownActive=true;countdownStart=null;last=null;toggle.textContent='カウント中';toggle.disabled=true;cd.style.display='flex';cdNum.textContent='3';render()}
function tick(now){if(last===null)last=now;let dt=Math.min((now-last)/1000,.15);last=now;
 if(countdownActive){if(countdownStart===null)countdownStart=now;let remaining=3-(now-countdownStart)/1000;
 if(remaining>0){cdNum.textContent=String(Math.ceil(remaining))}else{countdownActive=false;cd.style.display='none';toggle.disabled=false;playing=true;toggle.textContent='一時停止';last=now}}
 else if(playing){elapsed+=dt*rate;if(elapsed>=duration){elapsed=duration;playing=false;toggle.textContent='再生'}}
 render();requestAnimationFrame(tick)}
toggle.onclick=()=>{if(countdownActive)return;if(elapsed>=duration){startCountdown();return}playing=!playing;toggle.textContent=playing?'一時停止':'再生'};

seek.oninput=()=>{if(countdownActive){countdownActive=false;cd.style.display='none';toggle.disabled=false;playing=false;toggle.textContent='再生'}elapsed=Number(seek.value);render()};
// 地図のタイルが初期表示された後に3秒カウントを開始
map.whenReady(()=>{startCountdown();requestAnimationFrame(tick)});
</script></body></html>
