<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2026/09/27</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:white;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}#map{height:100vh;width:100vw;background:#d7e4e3}.leaflet-container{background:#d7e4e3}.hud{position:absolute;z-index:1000;top:20px;left:20px;background:#101820e8;padding:13px 18px;border-radius:12px;box-shadow:0 2px 15px #0005;pointer-events:none}.hud b{font-size:19px}.hud .sub{font-size:13px;color:#d1dbe3;margin-top:5px}.controls{position:absolute;z-index:1000;bottom:24px;left:50%;transform:translateX(-50%);background:#101820e8;padding:12px 17px;border-radius:13px;display:flex;align-items:center;gap:14px;white-space:nowrap;box-shadow:0 2px 15px #0006}.controls button{background:#fff;color:#14212c;border:0;border-radius:8px;font-weight:700;padding:9px 15px;cursor:pointer}.controls input[type="range"]{width:min(30vw,300px);accent-color:#b22d5b}.controls .rate-input{width:70px;background:#fff;color:#14212c;border:0;border-radius:6px;padding:8px;font-size:16px;font-weight:700;text-align:center}.controls .rate-wrap{display:flex;align-items:center;gap:5px;font-size:14px}.controls .rate-input:invalid{outline:2px solid #f66}.marker-wrap{position:relative;width:0;height:0;pointer-events:none}.marker-time{position:absolute;left:20px;top:-32px}.marker-time{background:#ffffff88;color:#b22d5b;padding:6px 10px;border-radius:7px;font-size:16px;font-weight:750;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:none;box-shadow:none}.marker-time .coordinate{display:block;font-size:16px;font-weight:750;letter-spacing:.04em;line-height:1.45}.marker-time .time-value{display:block;margin-bottom:3px} .zoom-panel{position:absolute;z-index:1100;right:18px;top:18px;background:#101820e8;border-radius:12px;padding:10px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 15px #0006;color:white}.zoom-panel button{background:#fff;color:#17212a;border:0;border-radius:7px;font-size:22px;font-weight:bold;width:37px;height:37px;cursor:pointer}.zoom-panel input{width:145px;accent-color:#b22d5b}.zoom-panel label{font-size:12px;white-space:nowrap}.countdown{position:absolute;z-index:1200;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}.countdown span{font-size:clamp(110px,22vw,250px);font-weight:900;color:#fff;text-shadow:0 5px 25px #000c,0 0 10px #0008}.leaflet-control-attribution{font-size:11px!important}
@media(max-width:700px){.controls{gap:7px;padding:8px;max-width:98vw}.controls button{padding:7px 8px}.controls input[type="range"]{width:18vw}.controls .rate-input{width:55px}.hud{top:10px;left:10px;padding:8px}.hud b{font-size:15px}.hud .sub{font-size:11px}}

/* 300pxのキャプチャ枠直下に操作系を一体化 */
.operation-panel{position:absolute;z-index:1100;left:50%;top:calc(50% + 250px + 8px);transform:translateX(-50%);width:min(300px,calc(100vw - 16px));padding:10px 12px;background:#101820ee;border-radius:12px;box-shadow:0 2px 15px #0007;display:flex;flex-direction:column;gap:9px}
.operation-panel .zoom-panel,.operation-panel .controls{position:static;transform:none;width:100%;max-width:none;margin:0;padding:0;background:none;border-radius:0;box-shadow:none}
.operation-panel .zoom-panel{display:flex;gap:10px;justify-content:space-between}
.operation-panel .zoom-panel input{flex:1;min-width:0;width:auto}
.operation-panel .zoom-panel button{flex:0 0 35px;height:33px;width:35px}
.operation-panel .controls{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;white-space:nowrap}
.operation-panel .controls #seek{grid-column:1/-1;grid-row:1;width:100%;min-width:0;margin:2px 0}
.operation-panel .controls button{padding:7px 9px;font-size:12px}
.operation-panel .controls #clock{font-size:12px;font-variant-numeric:tabular-nums}
.operation-panel .controls .rate-wrap{font-size:12px;gap:3px}
.operation-panel .controls .rate-input{width:51px;padding:6px 3px;font-size:13px}
.operation-panel .controls #exportHtml{font-size:11px}
@media(max-width:520px){.operation-panel{padding:8px;gap:7px}.operation-panel .controls{gap:5px;grid-template-columns:auto 1fr auto auto}.operation-panel .controls #exportHtml{grid-column:1/-1}.operation-panel .controls button{padding:6px}.operation-panel .zoom-panel{gap:5px}}

/* 書き出しHTMLの日付・ポイント数を操作パネルの先頭に表示 */
.operation-panel .hud{position:static;transform:none;pointer-events:none;background:transparent;box-shadow:none;padding:2px 4px 8px;border-radius:0;border-bottom:1px solid #ffffff33;text-align:center;width:100%}
.operation-panel .hud b{font-size:17px}

/* 300px縦型操作パネル：既存の配色設定には触れない */
.operation-panel{width:min(300px,calc(100vw - 16px));top:calc(50% + 250px + 20px);padding:12px 12px 10px;gap:9px}
.operation-panel .panel-heading{font-size:18px;font-weight:400;text-align:center;padding:0 0 10px;border-bottom:1px solid #ffffff66;font-variant-numeric:tabular-nums}
.operation-panel .controls{display:flex;flex-direction:column;align-items:stretch;gap:7px}
.operation-panel .controls .clock-row{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums}
.operation-panel .controls #seek{width:100%;margin:0;flex:none}
.operation-panel .controls .play-row{display:flex;justify-content:space-around;align-items:center;gap:8px}
.operation-panel .controls .rate-wrap{font-size:14px;gap:4px}
.operation-panel .controls .rate-input{width:53px;font-size:14px}
.operation-panel .controls button{font-size:13px;padding:7px 13px}
.operation-panel .zoom-panel{gap:9px;justify-content:space-between}
.operation-panel .zoom-panel label{font-size:12px}
.operation-panel .zoom-panel button{flex:0 0 35px;width:35px;height:33px}
.operation-panel .zoom-panel input{flex:1;min-width:0;width:20px}
.export-under-panel{position:absolute;z-index:1100;left:50%;top:calc(50% + 250px + 20px + 210px);transform:translateX(-50%);display:flex;justify-content:center;pointer-events:none}
.export-under-panel button{pointer-events:auto;background:#fff;color:#14212c;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.export-under-panel button:disabled{opacity:.5}
@media(max-width:520px){.operation-panel{padding:10px 10px 9px;gap:8px}.operation-panel .controls{display:flex;gap:7px}.operation-panel .zoom-panel{gap:7px}}
</style></head><body><div id="map"></div><div class="capture-credit-position"><div class="capture-credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div><div class="countdown" id="countdown"><span id="countdownNumber">3</span></div><div class="operation-panel"><div class="panel-heading" id="panelHeading">2026/09/27 7</div><div class="controls"><div class="clock-row" id="clock"><span id="startClock">00:00:00</span><span id="endClock">00:00:00</span></div><input id="seek" type="range" min="0" max="45" value="0" step="0.1"><div class="play-row"><button id="toggle">一時停止</button><label class="rate-wrap" for="rateInput"><input id="rateInput" class="rate-input" type="number" min="1" step="1" value="3" inputmode="numeric" aria-label="再生倍率"> 倍速</label></div></div><div class="zoom-panel"><label for="zoomRange">ズーム <strong id="zoomLabel">15</strong></label><button id="zoomOut" title="縮小">−</button><input id="zoomRange" aria-label="地図ズーム" type="range" min="9" max="19" step="0.5" value="15"><button id="zoomIn" title="拡大">＋</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const pts=[[0,36.737275,139.563711],[5,36.737241,139.563723],[10,36.737228,139.563763],[15,36.737226,139.56377],[35,36.737518,139.564025],[40,36.73784,139.564214],[45,36.737855,139.564141]];const duration=45;let rate=3;const startTimeSeconds=52008;const map=L.map('map',{zoomControl:false,scrollWheelZoom:true,dragging:false,doubleClickZoom:false,keyboard:false,attributionControl:true,zoomSnap:0,zoomDelta:0.5}).setView([pts[0][1],pts[0][2]],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const full=L.polyline(pts.map(p=>[p[1],p[2]]),{color:'#ffffff',weight:1,opacity:.10,lineJoin:'round'}).addTo(map);L.polyline(pts.map(p=>[p[1],p[2]]),{color:'#000000',weight:2,opacity:.99,lineJoin:'round'}).addTo(map);
const traveled=L.polyline([[pts[0][1],pts[0][2]]],{color:'#b22d5b',weight:5.5,opacity:1,lineJoin:'round'}).addTo(map);
const marker=L.marker([pts[0][1],pts[0][2]],{icon:L.divIcon({className:'',html:'<div class="marker-wrap"><div class="marker-time"><span class="time-value" id="markerTime">13:17:03</span><span class="coordinate" id="markerLat">35.843219</span><span class="coordinate" id="markerLng">139.851920</span></div></div>',iconSize:[0,0],iconAnchor:[0,0]})}).addTo(map);
let elapsed=0,playing=false,last=null,countdownStart=null,countdownActive=false;const seek=document.getElementById('seek'),clock=document.getElementById('clock'),toggle=document.getElementById('toggle');
const formatClock=seconds=>[Math.floor(seconds/3600)%24,Math.floor(seconds/60)%60,Math.floor(seconds)%60].map(v=>String(v).padStart(2,'0')).join(':');
document.getElementById('startClock').textContent=formatClock(startTimeSeconds);document.getElementById('endClock').textContent=formatClock(startTimeSeconds+duration);
function position(t){let target=Math.max(0,Math.min(t,pts[pts.length-1][0]));let lo=0,hi=pts.length-1;while(lo+1<hi){let mid=(lo+hi)>>1;if(pts[mid][0]<=target)lo=mid;else hi=mid}let a=pts[lo],b=pts[hi],f=Math.max(0,Math.min(1,(target-a[0])/Math.max(.0001,b[0]-a[0])));return {lat:a[1]+(b[1]-a[1])*f,lng:a[2]+(b[2]-a[2])*f,index:lo}}
function render(){let t=elapsed,p=position(t),latlng=[p.lat,p.lng];map.panTo(latlng,{animate:false});marker.setLatLng(latlng);let line=pts.slice(0,p.index+1).map(q=>[q[1],q[2]]);line.push(latlng);traveled.setLatLngs(line);seek.value=elapsed;let s=Math.floor(elapsed);const absoluteTime=startTimeSeconds+s;document.getElementById('markerLat').textContent=pts[p.index][1].toFixed(6);document.getElementById('markerLng').textContent=pts[p.index][2].toFixed(6);document.getElementById('markerTime').textContent=[Math.floor(absoluteTime/3600)%24,Math.floor(absoluteTime/60)%60,absoluteTime%60].map(v=>String(v).padStart(2,'0')).join(':');}
const rateInput=document.getElementById('rateInput');rateInput.addEventListener('change',()=>{const n=Number(rateInput.value);if(Number.isSafeInteger(n)&&n>=1&&n<=1000){rate=n}else{rateInput.value=String(rate)}});
const zoomRange=document.getElementById('zoomRange'),zoomLabel=document.getElementById('zoomLabel');
function updateZoomUI(){let z=map.getZoom();zoomRange.value=z;zoomLabel.textContent=z.toFixed(1)}
function setZoom(z){map.setZoom(Math.max(9,Math.min(19,z)),{animate:false});updateZoomUI()}
document.getElementById('zoomIn').onclick=()=>setZoom(map.getZoom()+0.5);
document.getElementById('zoomOut').onclick=()=>setZoom(map.getZoom()-0.5);
zoomRange.oninput=()=>setZoom(Number(zoomRange.value));
map.on('zoomend',updateZoomUI);updateZoomUI();
const cd=document.getElementById('countdown'),cdNum=document.getElementById('countdownNumber');
function startCountdown(){elapsed=0;playing=false;countdownActive=true;countdownStart=null;last=null;toggle.textContent='カウント中';toggle.disabled=true;cd.style.display='flex';cdNum.textContent='3';render()}
function tick(now){if(last===null)last=now;let dt=Math.min((now-last)/1000,.15);last=now;
 if(countdownActive){if(countdownStart===null)countdownStart=now;let remaining=3-(now-countdownStart)/1000;
 if(remaining>0){cdNum.textContent=String(Math.ceil(remaining))}else{countdownActive=false;cd.style.display='none';toggle.disabled=false;playing=true;toggle.textContent='一時停止';last=now}}
 else if(playing){elapsed+=dt*rate;if(elapsed>=duration){elapsed=duration;playing=false;toggle.textContent='再生'}}
 render();requestAnimationFrame(tick)}
toggle.onclick=()=>{if(countdownActive)return;if(elapsed>=duration){startCountdown();return}playing=!playing;toggle.textContent=playing?'一時停止':'再生'};

seek.oninput=()=>{if(countdownActive){countdownActive=false;cd.style.display='none';toggle.disabled=false;playing=false;toggle.textContent='再生'}elapsed=Number(seek.value);render()};
// 地図のタイルが初期表示された後に3秒カウントを開始
map.whenReady(()=>{startCountdown();requestAnimationFrame(tick)});
</script></body></html>
